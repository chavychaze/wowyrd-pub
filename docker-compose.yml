## WoWyrd — Client install (compiled images only, no source)
##
## This is the minimal install stack: wowyrd-app +
## wowyrd-dashboard + postgres + redis. No `build:` key anywhere — every image is pulled
## pre-compiled from ghcr.io/chavychaze; this repo never contains WoWyrd's Rust/C source.
##
## Explicit versioning only: set WOWYRD_VERSION to a real released tag (see README.md's
## "Versions" section). There is no `latest` tag published — a live risk-scoring engine
## shouldn't let a re-pull silently change what's running.
##
## Quick start: cp .env.example .env, fill in the two required secrets, then:
##   docker compose up -d

services:

  wowyrd-app:
    image: ghcr.io/chavychaze/wowyrd-app:${WOWYRD_VERSION:?set WOWYRD_VERSION in .env — see README.md}
    container_name: wowyrd-app
    restart: unless-stopped
    # eBPF requirements on Linux (gracefully degrades to PostgreSQL-only mode if unavailable —
    # this is the expected, supported mode on a first pilot install; see README.md).
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    network_mode: host
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - ./config/intel:/etc/wowyrd:ro
      - app_logs:/var/log/wowyrd
    environment:
      - POSTGRES_DSN=postgres://wowyrd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@localhost:5432/wowyrd_app
      - REDIS_ADDR=localhost:6379
      - HTTP_ADDR=0.0.0.0:8090
      - BPF_FS_PATH=/sys/fs/bpf/wowyrd
      - LOADER_SOCKET=/var/run/wowyrd-app-loader.sock
      - IP2LOCATION_DB=/etc/wowyrd/ip2location.BIN
      - GEOIP_ASN_DB=/etc/wowyrd/GeoLite2-ASN.mmdb
      - GEOIP_COUNTRY_DB=/etc/wowyrd/GeoLite2-Country.mmdb
      - BIN_DB_PATH=/etc/wowyrd/bin-database.csv
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEYS=${API_KEYS:?set API_KEYS in .env}
      # Safe by default — no automatic blocks. Change only deliberately, after evidence
      # review.
      - ENFORCEMENT_MODE=${ENFORCEMENT_MODE:-observe}
      - BPF_OBJECT_PATH=/usr/local/share/wowyrd/tc.bpf.o
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # PII-anonymization pass over risk_assessments — fail-safe by design: an unset key
      # skips the pass entirely (a warn-logged no-op) rather than anonymizing weakly. Set a
      # real value before relying on this for any deployment retaining real customer data.
      - RETENTION_HASH_KEY=${RETENTION_HASH_KEY:-}
      - RETENTION_ANONYMIZE_AFTER_DAYS=${RETENTION_ANONYMIZE_AFTER_DAYS:-180}
      - LICENSE_FILE=${LICENSE_FILE:-/etc/wowyrd/license.json}
      - INTEL_BUNDLE_URL=${INTEL_BUNDLE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  wowyrd-dashboard:
    image: ghcr.io/chavychaze/wowyrd-dashboard:${WOWYRD_VERSION:?set WOWYRD_VERSION in .env}
    container_name: wowyrd-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000"
    environment:
      # Set HOST_IP to this machine's real reachable address (EC2 public IP, ALB hostname,
      # etc.) if the dashboard will be viewed from a different machine than it runs on.
      - VITE_API_URL=http://${HOST_IP:-localhost}:8090
      - VITE_WS_URL=ws://${HOST_IP:-localhost}:8090/v1/ws/events
      - VITE_API_KEY=${API_KEYS:?set API_KEYS in .env}
    depends_on:
      wowyrd-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: wowyrd-postgres
    restart: unless-stopped
    ports:
      # Set POSTGRES_BIND=127.0.0.1 on an internet-facing host to avoid exposing the DB.
      - "${POSTGRES_BIND:-0.0.0.0}:5432:5432"
    environment:
      - POSTGRES_DB=wowyrd_app
      - POSTGRES_USER=wowyrd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wowyrd -d wowyrd_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wowyrd-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND:-0.0.0.0}:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  app_logs:
