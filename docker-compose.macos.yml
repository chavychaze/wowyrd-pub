## WoWyrd — macOS / Docker Desktop overlay for the Full profile (bridge networking, eBPF off)
##
## docker-compose.yml runs wowyrd-app with `network_mode: host` + `privileged: true`, for
## optional eBPF enforcement on Linux. Under Docker Desktop for Mac, host networking shares the
## Docker Desktop VM's network namespace, not the Mac's own: wowyrd-app's healthcheck passes,
## but port 8090 is unreachable from the Mac itself, so the dashboard cannot reach the API.
## This overlay moves wowyrd-app onto Compose's normal project network instead. eBPF does not
## attach under Docker Desktop in either mode, so on a Mac WoWyrd runs in PostgreSQL-only mode,
## with the same Postgres + Redis stack as the Full profile on Linux.
##
## Usage:
##   cp .env.example .env   # fill in WOWYRD_VERSION, POSTGRES_PASSWORD, API_KEYS
##   docker compose -f docker-compose.yml -f docker-compose.macos.yml up -d
##
## Verify the override took effect before trusting it (it relies on the `!reset`/`!override`
## YAML tags, Compose >= 2.24, the same mechanism docker-compose.lite.yml uses):
##   docker compose -f docker-compose.yml -f docker-compose.macos.yml config | grep network_mode
##                                          # expect no output
##   curl -f http://localhost:8090/health   # from the Mac itself, not docker exec

services:
  wowyrd-app:
    # `!reset null` clears network_mode, so the service joins Compose's default project network,
    # which has embedded service-name DNS. A plain `network_mode: bridge` would attach to
    # Docker's legacy bridge network instead, which has no DNS and would break the postgres/redis
    # names below.
    network_mode: !reset null
    privileged: !override false
    cap_add: !override []
    ports:
      - "${WOWYRD_APP_PORT:-8090}:8090"
    # `!override`, not a plain list: Compose concatenates `volumes:` lists, so without it the
    # base file's `/sys/fs/bpf` bind mount stays in the merged config (confirmed via
    # `docker compose config`), and that path does not exist on macOS.
    volumes: !override
      - ./config/intel:/etc/wowyrd:ro
      - app_logs:/var/log/wowyrd
    # Compose merges `environment:` by variable name, so only the entries below change; every
    # other base-file entry is kept. The base file's `localhost` addresses only work under host
    # networking. On the project network, wowyrd-app reaches postgres/redis by service name.
    environment:
      - POSTGRES_DSN=postgres://wowyrd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/wowyrd_app
      - REDIS_ADDR=redis:6379
      - HTTP_ADDR=0.0.0.0:8090
      # Empty on purpose: the image's entrypoint starts the eBPF loader only when this is
      # non-empty, so the app stays cleanly in PostgreSQL-only mode.
      - BPF_OBJECT_PATH=
      - NETWORK_INTERFACE=
      - IP2LOCATION_DB=/etc/wowyrd/ip2location.BIN
      - GEOIP_ASN_DB=/etc/wowyrd/GeoLite2-ASN.mmdb
      - GEOIP_COUNTRY_DB=/etc/wowyrd/GeoLite2-Country.mmdb
      - BIN_DB_PATH=/etc/wowyrd/bin-database.csv
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEYS=${API_KEYS:?set API_KEYS in .env}
      - ENFORCEMENT_MODE=${ENFORCEMENT_MODE:-observe}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RETENTION_HASH_KEY=${RETENTION_HASH_KEY:-}
      - RETENTION_ANONYMIZE_AFTER_DAYS=${RETENTION_ANONYMIZE_AFTER_DAYS:-180}

  wowyrd-dashboard:
    environment:
      - VITE_API_URL=http://${HOST_IP:-localhost}:${WOWYRD_APP_PORT:-8090}
      - VITE_WS_URL=ws://${HOST_IP:-localhost}:${WOWYRD_APP_PORT:-8090}/v1/ws/events
      - VITE_API_KEY=${API_KEYS:?set API_KEYS in .env}
